name: Deploy to Firebase Hosting
"on":
  push:
    branches:
      - master
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RISHABNAYAK_PERSONAL_WEBSITE }}"
          channelId: live
          projectId: rishabnayak-personal-website
          # Pinned: firebase-tools 15.34.x checks serviceusage.services.get,
          # which this service account lacks. 15.22.4 was the last version that
          # deployed successfully here. Unpin once the SA has Service Usage Consumer.
          firebaseToolsVersion: 15.22.4
